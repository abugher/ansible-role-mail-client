smtp_users:
  - 'nagios-notifications'
install_packages:
  - 'postfix'
  - 'libsasl2-modules'
install_files:
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'files/master.cf'
    dest:                       '/etc/postfix/master.cf'
template_files:
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'templates/main.cf.j2'
    dest:                       '/etc/postfix/main.cf'
  - owner:                      'root'
    group:                      'root'
    mode:                       '0600'
    src:                        'templates/smtp_usernames_and_passwords.j2'
    dest:                       '/etc/postfix/smtp_usernames_and_passwords'
create_files:
  - owner:                      'root'
    group:                      'root'
    mode:                       '0600'
    state:                      'touch'
    path:                       '/etc/postfix/smtp_usernames_and_passwords.db'
shell_commands_ignore_change:
  - command:                    postmap /etc/postfix/smtp_usernames_and_passwords
start_services:
  - 'postfix'
restart_services:               "{{ start_services }}"
